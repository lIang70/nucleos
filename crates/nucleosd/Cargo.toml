[package]
name = "nucleosd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The nucleos daemon: authentication, wire translation, and a listener around the kernel."
readme = "../../README.md"
keywords = ["agent", "kernel", "daemon", "grpc"]
categories = ["development-tools"]

[dependencies]
axum = { workspace = true }
axum-server = { workspace = true }
nucleos = { workspace = true }
nucleos-agent = { workspace = true }
nucleos-auth = { path = "../nucleos-auth" }
nucleos-mcp = { workspace = true }
nucleos-openai = { workspace = true }
nucleos-policy = { path = "../nucleos-policy" }
# Named because the daemon has to *choose* a provider: the HTTP client pulls `ring` and the TLS server
# pulls `aws-lc-rs`, so rustls will not pick one and the listener would panic at start-up.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
nucleos-sqlite = { path = "../nucleos-sqlite" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
http-body-util = "0.1"
nucleos-cli = { path = "../nucleos-cli" }
rcgen = "0.13"
webpki-roots = "0.26"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
nucleos-testkit = { path = "../nucleos-testkit" }
tower = { workspace = true }

[lints]
workspace = true
