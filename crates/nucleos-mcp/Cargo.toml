[package]
name = "nucleos-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP tool sources for the nucleos kernel."
readme = "../../README.md"
keywords = ["agent", "kernel", "mcp", "tools"]
categories = ["development-tools"]

[dependencies]
tracing = { workspace = true }
async-trait = { workspace = true }
base64 = "0.22"
nucleos = { workspace = true }
rmcp = { version = "3.8", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest",
    "transport-streamable-http-client",
    "client-side-sse",
] }
serde_json = { workspace = true }
tokio = { workspace = true }
# The same major as the one `rmcp` links: two versions would be two `StreamableHttpClient` impls.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }


[dev-dependencies]
tokio = { workspace = true }
nucleosd = { path = "../nucleosd" }

[lints]
workspace = true
