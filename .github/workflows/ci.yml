---
name: ci

# Quoted: YAML 1.1 reads a bare `on` as a boolean, and some
# linters refuse to guess.
"on":
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: bubblewrap
        # The Linux sandbox path is only exercised where it can run. Without this the tests
        # that would catch a broken `bwrap` command line skip, loudly, on every run.
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Test
        # Includes the tests that are gates rather than checks: the module graph, the
        # absence of a transport dependency in the kernel, and the committed schema
        # matching the code.
        run: cargo test --workspace
      - name: Docs
        run: cargo doc --workspace --no-deps
