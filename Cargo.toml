[workspace]
resolver = "3"
members = ["crates/contract", "crates/ports"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
async-trait = "0.1"

# `unwrap` is a bug, not a shortcut. `expect` needs a reason on the line.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
