syntax = "proto3";

package nucleos.v1;

import "nucleos/v1/session.proto";
import "nucleos/v1/source.proto";
import "nucleos/v1/event.proto";
import "nucleos/v1/generate.proto";

// The service definition and nothing else — the table of contents for the ABI.
//
// Keeping the service in its own file means a method added here is a one-line diff that
// cannot hide a schema change beside it.

// The nucleos kernel ABI.
//
// One service, twelve methods, one event stream. Session control (Describe, Start, Run,
// Send, Credit, Cancel, Close, List) is per-session and hot; source management (Register,
// Deregister, Sources, Reload) is node-wide and rare. They are separate groups on
// purpose: merging them would make every session call carry node-wide authority.
//
// Versioning: package nucleos.v1. Fields are added, never removed, never renamed, never
// re-typed. Enum values are added, never renumbered. A breaking change becomes nucleos.v2
// served side by side.
//
// Before the first published release a field may still be deleted outright; after it, the
// only correct removal is `reserved <number>` plus `reserved "<name>"`.
//
// Tenancy: `tenant` never appears on a request. It comes from the authenticated principal,
// because a request that names its own tenant is a request that can name somebody else's.
// Session identity is the pair (tenant, session).
service Kernel {
  // Capabilities and the current generation.
  rpc Describe(DescribeRequest) returns (DescribeResponse);

  // Create a session, pinned to a generation. With `resume` set, restore and continue.
  rpc Start(StartRequest) returns (StartResponse);

  // Stream events from `from_seq` (replay) then live. Resumable, not a subscription.
  rpc Run(RunRequest) returns (stream Event);

  // User input, steering, and human-in-the-loop verdicts.
  rpc Send(SendRequest) returns (SendResponse);

  // Extend the session's budget.
  rpc Credit(CreditRequest) returns (CreditResponse);

  // Request an orderly stop: finish the current turn, checkpoint, terminate.
  rpc Cancel(CancelRequest) returns (CancelResponse);

  // Terminate and release resources.
  rpc Close(CloseRequest) returns (CloseResponse);

  // Sessions on this node.
  rpc List(ListRequest) returns (ListResponse);

  // Add or update a tool source. Produces a new pending generation.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Remove a tool source. Produces a new pending generation.
  rpc Deregister(DeregisterRequest) returns (DeregisterResponse);

  // Tool sources, generations, and health.
  rpc Sources(SourcesRequest) returns (SourcesResponse);

  // Commit the pending source set as one atomic generation swap.
  rpc Reload(ReloadRequest) returns (ReloadResponse);

  // Invoke a model directly: the same path a session uses, without a session.
  //
  // It exists because normalization, routing, retries and cost accounting are the kernel's
  // job, and a caller that wants one of them wants all of them. Stateless on purpose: no
  // session is created, nothing is written to the event log, and a one-off call cannot
  // pollute `List`.
  rpc Generate(GenerateRequest) returns (stream GenerateEvent);
}

message DescribeRequest {}

message DescribeResponse {
  string version = 1;
  repeated string models = 2;
  repeated string abi_versions = 3;
  uint64 generation = 4;
  bool mcp_sampling = 5;
  bool mcp_elicitation = 6;
}
