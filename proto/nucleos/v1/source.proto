syntax = "proto3";

package nucleos.v1;

import "nucleos/v1/common.proto";

// Tool sources and generations.
//
// A source is *declared*, never inlined: the daemon connects and discovers the tool specs
// over MCP. Pushing definitions through this ABI would turn it into a plugin protocol.

message StdioTransport {
  string command = 1;
  repeated string args = 2;
  map<string, string> env = 3;
}

message HttpTransport {
  string url = 1;
  string bearer_token = 2;
}

enum Isolation {
  ISOLATION_UNSPECIFIED = 0;
  ISOLATION_NONE = 1;
  ISOLATION_PROCESS = 2;
  ISOLATION_VM = 3;
}

// A source is declared, never inlined: the daemon connects and discovers the tool specs
// over MCP. A definition on the wire would turn this ABI into a plugin protocol.
message ToolSource {
  string name = 1;
  oneof transport {
    StdioTransport stdio = 2;
    HttpTransport http = 3;
  }
  repeated string allow = 4;
  Isolation isolation = 5;
}

message RegisterRequest {
  ToolSource source = 1;
}

message RegisterResponse {
  Error error = 1;
  // The generation that will exist once `Reload` commits. Not yet latest.
  uint64 pending_generation = 2;
}

message DeregisterRequest {
  string name = 1;
}

message DeregisterResponse {
  Error error = 1;
  uint64 pending_generation = 2;
}

message SourcesRequest {}

message SourceInfo {
  ToolSource source = 1;
  bool healthy = 2;
  uint32 tool_count = 3;
  string last_error = 4;
}

message SourcesResponse {
  repeated SourceInfo sources = 1;
  // The generation new sessions are pinned to.
  uint64 generation = 2;
  // Sessions still running on an older generation, so they cannot be retired.
  uint32 pinned_sessions = 3;
}

message ReloadRequest {
  // Compare the new generation against this one when deciding migratability.
  // Zero means "the current latest".
  uint64 base_generation = 1;
}

message SourceFailure {
  string source = 1;
  Error error = 2;
}

message ReloadResponse {
  uint64 generation = 1;
  // Partial success is the normal case; failing the whole swap for one broken source
  // hides the ones that did work.
  repeated SourceFailure failed = 2;
  uint32 migrated_sessions = 3;
  uint32 pinned_sessions = 4;
}
