syntax = "proto3";

package nucleos.v1;

import "nucleos/v1/common.proto";
import "nucleos/v1/content.proto";
import "nucleos/v1/generation.proto";

message SessionSpec {
  // The route, in order: the first name that answers wins. Empty means the daemon default.
  //
  // A route rather than a single name because the kernel owns retries and fallback: a gateway
  // that gives up on the first 503 is a gateway whose availability is its provider's.
  repeated string model_chain = 1;
  // Extra attempts against the same target before falling through to the next one.
  uint32 retries = 2;
  string system = 3;
  repeated Message initial = 4;
  // Tool names exposed to this session. Empty means "everything the generation allows".
  repeated string tools = 5;
  GenerateParams params = 6;
  map<string, string> metadata = 7;
}

// What the *caller* can handle. The daemon downgrades rather than fails: a client that
// cannot render an image gets a `FilePart` reference instead of inline bytes.
//
// Both sides declare and neither assumes. A server that guesses at the client's abilities is
// wrong exactly for the client that needed the guess.
message ClientCapabilities {
  bool render_images = 1;
  // Largest single part the client accepts, in bytes. Zero means "no limit declared".
  uint64 max_part_bytes = 2;
  bool supports_progress = 3;
}

message StartRequest {
  // Caller-chosen id. With `resume` set, an existing session is continued instead of
  // created — which makes a retried Start idempotent.
  string session = 1;
  bool resume = 2;
  SessionSpec spec = 3;
  Budget budget = 4;
  // Initial credit for flow control; spent by `usage` events.
  uint64 credit_tokens = 5;
  ClientCapabilities client = 6;
}

message StartResponse {
  Error error = 1;
  string session = 2;
  uint64 generation = 3;
  SessionState state = 4;
  uint64 seq = 5;
}

message RunRequest {
  string session = 1;
  uint64 from_seq = 2;
}

message SendRequest {
  string session = 1;
  oneof input {
    Message message = 2;
    HitlVerdict verdict = 3;
  }
}

message HitlVerdict {
  string tool_call_id = 1;
  // The `PermissionOption.id` the human picked. A boolean would lose the difference
  // between "allow once" and "always allow" — and *always* is a policy decision the kernel
  // reports but never makes.
  string option_id = 2;
  string reason = 3;
}

message SendResponse {
  Error error = 1;
  uint64 accepted_seq = 2;
}

message CreditRequest {
  string session = 1;
  uint64 additional_tokens = 2;
  optional uint64 additional_micros_usd = 3;
}

message CreditResponse {
  Error error = 1;
  uint64 credit_tokens = 2;
}

message CancelRequest {
  string session = 1;
  string reason = 2;
}

message CancelResponse {
  Error error = 1;
  SessionState state = 2;
}

message CloseRequest {
  string session = 1;
}

message CloseResponse {
  Error error = 1;
  uint64 final_seq = 2;
}

message ListRequest {
  SessionState state = 1;
  // Zero means "the server's default page size".
  uint32 limit = 2;
  // Opaque, keyset-based cursor. Empty asks for the first page. A token stays valid while
  // the sessions around it change, which an offset cannot promise: sessions are created and
  // retired constantly, and offset paging then skips or repeats rows.
  string page_token = 3;
}

message SessionInfo {
  string session = 1;
  string tenant = 2;
  SessionState state = 3;
  uint64 generation = 4;
  uint64 seq = 5;
  uint64 steps = 6;
  Usage total_usage = 7;
}

message ListResponse {
  repeated SessionInfo sessions = 1;
  // Empty on the last page. A client must stop on empty, not on a short page: a page can be
  // short without being last.
  string next_page_token = 2;
}
